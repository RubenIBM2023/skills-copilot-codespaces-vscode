spring.application.name=spring-crud-ms
server.port=8080

# API Configuration - Global base path for all REST controllers
server.servlet.context-path=/api/v1

# Swagger / SpringDoc Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# MongoDB Configuration - Flapdoodle Embedded MongoDB
# Automático con Spring Boot 3.x
spring.data.mongodb.database=products_db
spring.data.mongodb.auto-index-creation=true

# Flapdoodle Embedded MongoDB Version
de.flapdoodle.mongodb.embedded.version=7.0.2

# PostgreSQL Configuration - H2 Embedded for Development
# Desarrollo: usa H2 embebido, sin necesidad de instalación
spring.datasource.url=jdbc:h2:mem:ordersdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# RabbitMQ Configuration - Deshabilitado para desarrollo local
# Comentado porque RabbitMQ no se ejecuta en desarrollo
# spring.rabbitmq.host=localhost
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=guest
# spring.rabbitmq.password=guest
# spring.rabbitmq.virtual-host=/

# Desabilitar autoconfiguración de AMQP si RabbitMQ no está disponible
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Logging
logging.level.root=INFO
logging.level.com.example.springcrudms=DEBUG
logging.level.de.flapdoodle.embed=INFO
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.data.jpa=DEBUG
