[project]
name = "legacy-teradata-migration"
version = "0.1.0"
description = "Sample legacy Teradata DW migrated to AWS (Redshift + Glue) by the OPF swarm"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
